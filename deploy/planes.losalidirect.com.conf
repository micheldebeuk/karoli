# Reverse proxy for the planes bot's control API, so Vercel can reach it.
# Same shape as api.losalidirect.com (see PROXY_PUBLIC_URL_RUNBOOK.md in the
# losali repo). Install as:
#
#   sudo cp deploy/planes.losalidirect.com.conf \
#           /etc/nginx/sites-available/planes.losalidirect.com.conf
#   sudo ln -sf /etc/nginx/sites-available/planes.losalidirect.com.conf \
#               /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d planes.losalidirect.com
#
# The bot binds to 127.0.0.1:3010 and never listens on a public interface — the
# bearer token is the only credential, so it must not travel without TLS.

server {
    listen 80;
    server_name planes.losalidirect.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name planes.losalidirect.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/planes.losalidirect.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/planes.losalidirect.com/privkey.pem;

    # Only the control API is exposed; nothing else on this host serves anything.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A real send waits on WhatsApp; do not cut it off early.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / { return 404; }
}
